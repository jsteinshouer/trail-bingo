[project]
name = "bioclip-export"
version = "0.0.0"
description = "Spike: export BioCLIP encoders to fp16 ONNX for the browser"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "torchvision",
  "open_clip_torch",
  "onnx",
  "onnxscript",
  "onnxruntime",
  "pillow",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
